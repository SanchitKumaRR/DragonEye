[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dragoneye"
version = "0.1.0"
description = "Scope-aware recon framework for bug bounty hunters (CLI + local web GUI)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dragoneye = "dragoneye.cli:main"

[tool.setuptools.packages.find]
include = ["dragoneye*"]

[tool.setuptools.package-data]
"dragoneye.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
